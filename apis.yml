aid: elmetr
name: ElMetr
description: >-
  ElMetr (المتر) is a Middle East legal-tech company providing online legal
  consultation and guidance for companies, entrepreneurs, and individuals. The
  platform combines licensed lawyers with modern technology to connect users
  with qualified legal help, offering subscription legal packages that cover
  company formation and registration, contract review, compliance, intellectual
  property, and dispute resolution. Founded in Egypt and now operating in Saudi
  Arabia, ElMetr aims to make legal work clear, fast, and fair so businesses can
  move faster and reduce risk from first idea through expansion. ElMetr is a 500
  Global (500 Startups) portfolio company. This company profile has been through
  the API Evangelist enrichment pipeline; ElMetr does not currently publish a
  public developer API, SDKs, or API documentation.
